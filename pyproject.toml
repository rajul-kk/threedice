[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "threedice"
version = "4.0.0.post1"
description = "Unofficial redistribution of the 3D-ICE 4.0 thermal simulator, pinned to upstream commit 4953952; not affiliated with or endorsed by EPFL ESL."
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
license-files = ["COPYING", "NOTICE"]
authors = [{ name = "Rajul Kabeer", email = "rajul.kabeer@gmail.com" }]
maintainers = [{ name = "Rajul Kabeer", email = "rajul.kabeer@gmail.com" }]
keywords = ["3D-ICE", "thermal simulation", "3D IC", "chiplet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Source = "https://github.com/rajul-kk/threedice"
Issues = "https://github.com/rajul-kk/threedice/issues"
Upstream = "https://github.com/esl-epfl/3d-ice"

[project.scripts]
3d-ice-emulator = "threedice._cli:main"

[tool.setuptools]
packages = ["threedice"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
